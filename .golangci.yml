version: "2"
linters:
  default: "standard"
  enable:
    - misspell
    - sloglint
  settings:
    sloglint:
      context: "scope"
formatters:
  enable:
    - gofmt
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/tomsalmo/clog)
        - prefix(github.com/tomsalmo)
        - default
